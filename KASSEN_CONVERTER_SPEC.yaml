project:
  name: KassenConverter
  version: "0.1"
  purpose: >
    Lokale Windows-Anwendung zur unveränderten Aufbereitung von Kassensystem-Exporten
    in CSV-Dateien als zusätzliche Arbeits- und Übergabeansicht für Steuerberatung
    sowie zur Nutzung der Artikeldaten in Excel.

scope:
  accounting_replacement: false
  datev_replacement: false
  modifies_original_records: false
  primary_goal: "Nachvollziehbare Projektion vorhandener Kassendaten in Excel-kompatible CSV-Dateien"
  secondary_goal: "Bereitstellung positionsgenauer und transparent aggregierter Artikeldaten für betriebliche Auswertungen"

runtime:
  platform: Windows
  distribution: "portable single-file EXE"
  language: Python 3
  packaging: PyInstaller
  dependencies:
    preference: "Python standard library only"
    expected_modules:
      - zipfile
      - xml.etree.ElementTree
      - csv
      - pathlib
      - logging
      - datetime
      - re
  gui: false
  database: false
  installation_required: false
  working_directory: "directory containing the executable"

inputs:
  sources:
    - id: datev_xml_export
      filename_pattern: "DATEV_XML_Export_*.zip"
      role: primary
      purpose:
        - receipts
        - item_positions
        - timestamps
        - vat_rates
        - payment_information
      validation:
        - "Do not trust filename alone."
        - "Validate ZIP contents and expected XML structure before parsing."

    - id: extf_booking_batch
      filename_pattern: "EXTF_Buchungsstapel_*.zip"
      role: control
      purpose:
        - accounting_cross_check
        - payment_method_cross_check
        - cash_card_plausibility
        - tip_cross_check
      validation:
        - "Do not trust filename alone."
        - "Validate ZIP contents and expected EXTF structure before parsing."

source_handling:
  modify_source_files: false
  delete_source_files: false
  move_source_files: false
  rename_source_files: false
  extract_persistently: false
  note: "Source ZIP files remain untouched in place."

outputs:
  csv_format:
    delimiter: ";"
    encoding: "utf-8-sig"
    decimal_separator: ","
    date_format: "DD.MM.YYYY"
    time_format: "HH:MM:SS"

  files:
    - id: full_positions
      filename: "Kasse_Vollstaendig_YYYY-MM.csv"
      granularity: "one row per source item position"
      purpose:
        - traceable_raw_view
        - excel_filtering
        - merchandise_analysis
      columns:
        - datum
        - uhrzeit
        - bonnummer
        - position
        - artikel
        - betrag
        - mwst
        - konto
        - zahlungsart
      rules:
        - "Values must originate from source data or from trivial transparent derivations."
        - "Position is a 1-based technical sequence number within each receipt, preserving XML source order."
        - "Do not silently invent categories, quantities or corrections."
        - "If repeated units are represented as repeated positions, preserve them as repeated rows."

    - id: receipt_summary
      filename: "Kasse_Bons_YYYY-MM.csv"
      granularity: "one row per receipt"
      purpose:
        - tax_advisor_working_view
        - cash_card_control
        - receipt_level_plausibility
      columns:
        - datum
        - uhrzeit
        - bonnummer
        - brutto_gesamt
        - brutto_7_prozent
        - brutto_19_prozent
        - trinkgeld
        - bar
        - karte
        - auf_rechnung
        - sonstige_zahlart
        - abwicklungssumme
        - differenz
        - pruefhinweis
      rules:
        - "VAT summary columns are derived only from source VAT rates."
        - "Payment method totals must remain separately visible."
        - "Auf Rechnung must be represented separately from other payment methods."
        - "Tips must remain separately visible and must not be treated as sales revenue."
        - "Difference must make receipt-level inconsistencies visible."

    - id: article_summary
      filename: "Artikel_Auswertung_YYYY-MM.csv"
      granularity: "one row per article and VAT rate for the month"
      purpose:
        - merchandise_overview
        - excel_filtering
      columns:
        - artikel
        - mwst
        - stk
        - umsatz
        - durchschnittspreis
      rules:
        - "Stk is the count of matching source item positions."
        - "Umsatz is the sum of their gross position amounts."
        - "Articles with different VAT rates must not be silently merged."
        - "This output is a transparent aggregation, not stock inventory management."

    - id: article_hourly_summary
      filename: "Artikel_Stunden_YYYY-MM.csv"
      granularity: "one row per date, hour bucket and article"
      purpose:
        - time_of_day_merchandise_overview
        - excel_filtering
        - weekday_comparison
      columns:
        - tag
        - datum
        - stunde
        - artikel
        - stk
        - umsatz
      rules:
        - "Grouping key is source date + clock-hour bucket + article label."
        - "Stunde uses HH:00-HH:59."
        - "Tag is deterministically derived from Datum and written in German."
        - "Stk is the count of matching source item positions."
        - "Umsatz is the sum of their gross position amounts."
        - "No behavioral interpretation is added by the converter."

filename_collision_policy:
  overwrite_existing: false
  strategy: "append_windows_style_counter"
  applies_to_all_generated_csv_files: true
  examples:
    - "Kasse_Vollstaendig_2026-06.csv"
    - "Kasse_Vollstaendig_2026-06 (1).csv"
    - "Kasse_Vollstaendig_2026-06 (2).csv"

logging:
  required: true
  filename: "KassenConverter.log"
  log:
    - start_and_end
    - detected_input_files
    - validated_input_types
    - processed_receipts
    - processed_item_positions
    - warnings
    - special_cases
    - parse_errors
    - plausibility_failures
    - output_files
  behavior:
    - "Errors must be understandable for a non-programmer."
    - "Do not suppress parse or plausibility errors silently."

plausibility_checks:
  required: true
  checks:
    - id: receipt_item_sum
      rule: "sum(item_positions) == receipt_total"
      on_failure: "mark warning and log details"

    - id: receipt_payment_sum
      rule: "receipt_total + tips == cash + card + on_account + other_payment_methods"
      on_failure: "mark difference and log details"

    - id: source_cross_check
      rule: "where technically possible, compare XML-derived values with EXTF booking batch"
      on_failure: "log discrepancy; do not silently reconcile"

cash_control:
  required: true
  principles:
    - "Cash and card must be separately represented."
    - "On-account transactions must not be counted as cash."
    - "Tips must be separately represented because they affect actual cash/card inflow without being sales revenue."
    - "Cash-related discrepancies must be visible."
    - "The converter must not invent balancing entries."

replacement_and_storno_references:
  required: true
  principles:
    - "Receipt identifiers containing markers such as '(ex-6819)' must be detected where reconstructable."
    - "The referenced predecessor and the replacement/follow-up receipt must be marked with a Pruefhinweis."
    - "Detection is a relationship hint only; the converter must not delete, merge or suppress either receipt automatically."
    - "A detected ex-reference must not be treated as proof of a legal or accounting cancellation without source evidence."

unknown_and_special_cases:
  silent_interpretation: false
  behavior:
    - "Unknown record types are not guessed."
    - "Ambiguous values are not automatically corrected."
    - "Missing EXTF payment records must be explicitly reported."
    - "If payment method is unambiguous in XML, it may be transparently derived and must be marked as such."
    - "Stornos, ex-references, vouchers and other special cases must remain identifiable."
    - "Uninterpretable records must create a warning or error entry."

invariants:
  modify_source_files: false
  overwrite_output_files: false
  silently_ignore_unknown_records: false
  silently_correct_source_values: false
  require_plausibility_checks: true
  require_cash_card_separation: true
  require_invoice_separation: true
  require_log: true
  require_traceability: true
  keep_primary_and_control_sources_distinct: true
  never_auto_merge_replacement_receipts: true
  article_summaries_are_derived_only_from_positions: true

non_goals_v0:
  - "No DATEV replacement."
  - "No accounting engine."
  - "No stock inventory management."
  - "No GUI."
  - "No interpretive, predictive or prescriptive business analytics."
  - "No direct Excel XLSX generation."
  - "No cloud service."
  - "No source data mutation."

acceptance_criteria:
  - "Executable starts by double-click on Windows."
  - "Executable reads input ZIP files from its own directory."
  - "Executable validates input content, not filenames only."
  - "Executable produces all four CSV outputs in its own directory."
  - "Kasse_Vollstaendig contains a 1-based receipt position number."
  - "Artikel_Auswertung aggregates count and gross revenue per article and VAT rate."
  - "Artikel_Stunden contains Tag, Datum, Stunde, Artikel, Stk. and Umsatz."
  - "Existing CSV files are never overwritten."
  - "Repeated runs create (1), (2), ... filenames."
  - "CSV files open correctly in German Excel."
  - "Cash, card, on-account and tip values are separately visible."
  - "Receipt revenue plus tips is checked against settlement sums."
  - "Missing EXTF payment records are explicitly reported."
  - "Recognizable ex/replacement references are marked without automatic deletion or merging."
  - "Unknown or ambiguous cases are explicitly reported."
  - "Original ZIP files remain unchanged."
